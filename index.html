<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05101b">
<title>МИСТЕР — карьера футбольного тренера</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#05101b;--bg2:#0a1c2d;--s1:#0e2235;--s2:#132c44;--s3:#1a3a56;--line:#20415d;--line2:#2f5c80;--txt:#eef8ff;--dim:#9dbad0;--dim2:#6d8da7;--lime:#c7ff3d;--lime2:#8fd420;--green:#2fd487;--sky:#35b9ff;--amber:#ffbd38;--red:#ff4f68;--mag:#e45cff;--gold:#ffd34e;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.45;overflow:hidden;overscroll-behavior:none}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 34% at 4% -8%,rgba(199,255,61,.15),transparent 62%),radial-gradient(56% 32% at 98% -6%,rgba(53,185,255,.17),transparent 62%),linear-gradient(180deg,#081b2c,#05101b 46%,#071726)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}
input,select{font-family:inherit;font-size:13px;color:var(--txt);background:var(--bg2);border:1px solid var(--line2);border-radius:11px;padding:10px 12px;outline:none;width:100%}
select{appearance:none;padding-right:28px}
input[type=range]{-webkit-appearance:none;appearance:none;background:none;border:none;padding:0;height:20px}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--sky),var(--lime))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:#fff;border:3px solid var(--lime2)}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:#2f5c80}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--lime2)}
.hidden{display:none!important}
svg{display:block}
#fx{position:fixed;inset:0;z-index:140;pointer-events:none}
.card{background:linear-gradient(165deg,var(--s2),var(--s1) 74%);border:1px solid var(--line);border-radius:15px;padding:13px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.card+.card{margin-top:9px}
.sect{display:flex;align-items:center;gap:7px;margin:15px 2px 8px;font-family:Unbounded,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.sect svg{color:var(--lime)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:800;border-radius:12px;padding:11px 15px;border:1px solid var(--line2);background:var(--s3);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn-p{background:linear-gradient(160deg,var(--lime),var(--lime2));color:#06131f;border-color:transparent}
.btn-d{background:rgba(255,79,104,.14);border-color:rgba(255,79,104,.45);color:var(--red)}
.btn-b{background:rgba(53,185,255,.14);border-color:rgba(53,185,255,.44);color:var(--sky)}
.btn-g{background:transparent}
.btn-s{padding:7px 11px;font-size:12px;border-radius:10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;border:1px solid var(--line2);background:var(--bg2);font-size:11px;font-weight:800;color:var(--dim);white-space:nowrap}
.chip.on{background:rgba(53,185,255,.2);border-color:var(--sky);color:var(--txt)}
.tag{display:inline-flex;font-size:9.5px;font-weight:900;padding:3px 7px;border-radius:99px}
.tag-l{background:rgba(199,255,61,.17);color:var(--lime)}
.tag-a{background:rgba(255,189,56,.17);color:var(--amber)}
.tag-r{background:rgba(255,79,104,.17);color:var(--red)}
.tag-s{background:rgba(53,185,255,.17);color:var(--sky)}
.tag-m{background:rgba(228,92,255,.17);color:var(--mag)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--lime)}
.dim{color:var(--dim)}.dim2{color:var(--dim2)}
.row{display:flex;align-items:center;gap:9px}.grow{flex:1;min-width:0}
.money{color:var(--lime);font-weight:800}.neg{color:var(--red)!important}
.rev{animation:fu .35s ease both}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#start{position:fixed;inset:0;z-index:40;overflow-y:auto;padding:calc(16px + var(--st)) 14px calc(24px + var(--sb));display:flex;justify-content:center}
.start-in{width:100%;max-width:940px;margin:auto 0}
.logo-wrap{text-align:center;padding:10px 0 6px}
.logo-ball{width:62px;height:62px;margin:0 auto 11px;border-radius:20px;background:linear-gradient(150deg,var(--lime),var(--green));display:flex;align-items:center;justify-content:center;color:#06131f;animation:float 4s ease-in-out infinite}
.logo{font-family:Unbounded,sans-serif;font-weight:900;font-size:clamp(30px,8vw,44px);letter-spacing:.04em}
.logo em{font-style:normal;color:var(--lime)}
.logo-sub{color:var(--dim);font-size:10.5px;margin-top:5px;letter-spacing:.17em;text-transform:uppercase;font-weight:800}
.step-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.step-n{width:24px;height:24px;border-radius:8px;background:rgba(199,255,61,.15);border:1px solid rgba(199,255,61,.45);color:var(--lime);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px}
.step-h b{font-family:Unbounded,sans-serif;font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{text-align:left;padding:11px;border-radius:13px;border:1px solid var(--line);background:var(--s1)}
.pick.on{border-color:var(--lime);background:rgba(199,255,61,.1)}
.pick b{font-family:Unbounded,sans-serif;font-size:12.5px;display:block;margin-bottom:4px}
.pick span{font-size:10.5px;color:var(--dim);display:block}
.club-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:7px;max-height:290px;overflow-y:auto}
.club-card{display:flex;gap:9px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--s1);text-align:left}
.club-card.on{border-color:var(--lime);background:rgba(199,255,61,.1)}
.club-card b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.club-card span{font-size:9.5px;color:var(--dim2);font-weight:700;display:block}
.club-card i{font-family:Unbounded,sans-serif;font-style:normal;font-weight:900;color:var(--lime)}
.start-sum{position:sticky;bottom:0;margin-top:12px;background:rgba(6,18,30,.98);border:1px solid var(--line2);border-radius:15px;padding:11px}
#app{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center}
#topbar{width:100%;max-width:1100px;display:flex;align-items:center;gap:9px;padding:calc(9px + var(--st)) 12px 9px;background:rgba(5,16,27,.96);border-bottom:1px solid var(--line);z-index:20}
.tb-n{font-weight:900;font-size:13px}
.tb-s{font-size:10px;color:var(--dim);font-weight:700}
.tb-m{display:flex;align-items:center;gap:5px;background:rgba(199,255,61,.11);border:1px solid rgba(199,255,61,.36);color:var(--lime);font-weight:900;font-size:12px;padding:6px 9px;border-radius:99px;white-space:nowrap}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--s1);display:flex;align-items:center;justify-content:center;color:var(--dim);flex:none}
.ib.on{color:var(--lime);border-color:var(--lime2)}
#main{width:100%;max-width:1100px;flex:1;overflow-y:auto;padding:11px 12px calc(90px + var(--sb));position:relative;z-index:5}
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:1100px;display:flex;background:rgba(6,19,31,.98);border-top:1px solid var(--line);padding:5px 2px calc(5px + var(--sb));z-index:30;overflow-x:auto}
.tab{flex:1;min-width:46px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 1px;color:var(--dim2);font-size:7.6px;font-weight:900;text-transform:uppercase;position:relative}
.tab.on{color:var(--lime)}
.tab.on:before{content:"";position:absolute;top:-6px;width:20px;height:3px;border-radius:99px;background:var(--lime)}
.hero{background:linear-gradient(160deg,#153a5c,#0d2236 64%);border:1px solid var(--line2)}
.hero.cup{border-color:rgba(255,211,78,.5);background:linear-gradient(160deg,#2e2410,#171208 62%)}
.hero.nat{border-color:rgba(228,92,255,.5);background:linear-gradient(160deg,#2c1444,#170e2c 62%)}
.eyebrow{font-size:9.5px;font-weight:900;letter-spacing:.15em;color:var(--lime);text-transform:uppercase;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vs{display:flex;align-items:center;justify-content:space-between;margin:12px 0 10px}
.vs-t{display:flex;flex-direction:column;align-items:center;gap:5px;width:38%;text-align:center}
.vs-t b{font-size:12px}
.vs-x{font-family:Unbounded,sans-serif;font-weight:900;font-size:18px;color:var(--dim2)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(270px,.85fr);gap:13px;align-items:start}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.s3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
.s3 .card{padding:9px;margin:0}
.s3 .l{font-size:8.6px;font-weight:900;text-transform:uppercase;color:var(--dim2)}
.s3 .v{font-family:Unbounded,sans-serif;font-weight:700;font-size:15px;margin:3px 0 5px}
.ib-card{border-left:3px solid var(--lime)}
.ib-card.job{border-left-color:var(--sky)}
.ib-card.sale{border-left-color:var(--amber)}
.ib-card.req{border-left-color:var(--red)}
.ib-card.press{border-left-color:var(--gold)}
.ib-card.nat{border-left-color:var(--mag)}
.ib-card.sp{border-left-color:var(--green)}
.ib-t{font-weight:900;font-size:12.5px;display:flex;gap:6px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.ib-x{font-size:12px;color:var(--dim);margin-bottom:9px}
.ib-b{display:flex;gap:6px;flex-wrap:wrap}
.news{display:flex;gap:7px;font-size:11.5px;color:var(--dim);padding:6px 2px;border-bottom:1px dashed rgba(255,255,255,.06)}
.news:last-child{border:none}
.news i{font-style:normal;font-size:9.5px;font-weight:900;color:var(--dim2);width:26px;flex:none}
.fd{display:inline-flex;width:15px;height:15px;border-radius:5px;font-size:8px;font-weight:900;align-items:center;justify-content:center;color:#06131f;margin-right:3px}
.fd.W{background:var(--lime)}.fd.D{background:var(--amber)}.fd.L{background:var(--red);color:#fff}
.pos{width:28px;height:20px;border-radius:6px;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#06131f;flex:none}
.pos.GK{background:var(--amber)}.pos.DEF{background:var(--sky)}.pos.MID{background:var(--green)}.pos.ATT{background:var(--red)}
.plr{display:flex;align-items:center;gap:8px;padding:8px 7px;border-radius:11px;cursor:pointer}
.plr:active{background:var(--s3)}
.plr.out{opacity:.5}
.pln{font-weight:900;font-size:12.5px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.plm{font-size:10px;color:var(--dim2);font-weight:700}
.rt{font-family:Unbounded,sans-serif;font-weight:700;font-size:14px;width:28px;text-align:center;flex:none}
.rt-h{color:var(--lime)}.rt-m{color:var(--green)}.rt-l{color:var(--amber)}.rt-b{color:var(--dim)}
.bars{width:44px;flex:none;display:flex;flex-direction:column;gap:2px}
.star{color:var(--dim2);width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex:none}
.star.on{color:var(--gold)}
.lh{font-size:9.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin:11px 4px 4px}
.tg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:9px}
.tb2{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border-radius:11px;border:1px solid var(--line);background:var(--bg2);font-size:9px;font-weight:900;color:var(--dim)}
.tb2 svg{color:var(--lime)}
.tb2.on{border-color:var(--lime);color:var(--lime)}
.pitch{width:100%;border-radius:11px;border:1px solid var(--line2)}
.mk{display:flex;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--s1);margin-bottom:7px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:7px;margin-bottom:4px}
.fl{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.06);gap:8px}
.fl:last-child{border:none}
.pips{display:flex;gap:3px}
.pip{width:15px;height:6px;border-radius:99px;background:rgba(255,255,255,.1)}
.pip.on{background:var(--lime)}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{font-size:8.6px;font-weight:900;color:var(--dim2);text-transform:uppercase;padding:5px 3px;text-align:left}
.tbl td{padding:6px 3px;border-top:1px solid rgba(255,255,255,.05);font-weight:700}
.tbl .n{text-align:center;color:var(--dim)}
.tbl .p{color:var(--lime);font-weight:900;text-align:center}
.tbl tr.me td{background:rgba(199,255,61,.09)}
.tbl tr.up td:first-child{box-shadow:inset 3px 0 0 var(--lime)}
.tbl tr.dn td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.cc{display:flex;align-items:center;gap:6px;min-width:0}
.cc b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.fx{display:flex;align-items:center;gap:7px;padding:7px 5px;font-size:11.5px;font-weight:700}
.fx.me{background:rgba(199,255,61,.09);border-radius:9px}
.fxs{font-family:Unbounded,sans-serif;font-weight:700;font-size:11.5px;width:44px;text-align:center;color:var(--lime)}
.fxs.u{color:var(--dim2)}
.tro{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:11px;background:rgba(255,211,78,.12);border:1px solid rgba(255,211,78,.45);color:var(--gold);font-weight:900;font-size:11px;margin:0 5px 5px 0}
.flag{display:inline-flex;align-items:center;justify-content:center;border-radius:11px;background:var(--s3);border:1px solid var(--line2);flex:none}
.sl{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin-bottom:8px}
.sl .h{display:flex;justify-content:space-between;font-size:10.5px;font-weight:900}
.sl .h b{color:var(--lime)}
.sl .d{font-size:9px;color:var(--dim2);font-weight:700}
.sw{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:var(--bg2);cursor:pointer;margin-bottom:6px}
.sw b{font-size:11.5px}
.sw i{width:36px;height:20px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;flex:none}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on i{background:var(--lime2)}
.sw.on i:after{transform:translateX(16px)}
.br{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.brc{min-width:145px;flex:none}
.brt{border:1px solid var(--line);border-radius:10px;background:var(--bg2);padding:6px 8px;margin-bottom:6px;font-size:10.5px;font-weight:800}
.brt.me{border-color:var(--lime)}
.brt .w{color:var(--lime)}
#modal{position:fixed;inset:0;z-index:100;background:rgba(2,8,15,.87);display:flex;align-items:center;justify-content:center;padding:16px}
#mcard{width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:linear-gradient(170deg,var(--s2),var(--s1));border:1px solid var(--line2);border-radius:20px;padding:20px 16px}
.mt{font-family:Unbounded,sans-serif;font-weight:700;font-size:15px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
#toasts{position:fixed;top:calc(10px + var(--st));left:50%;transform:translateX(-50%);z-index:150;width:calc(100% - 24px);max-width:420px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;background:rgba(14,34,53,.98);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:800;animation:fu .3s both}
.toast.ok{border-color:rgba(199,255,61,.55)}.toast.ok svg{color:var(--lime)}
.toast.err{border-color:rgba(255,79,104,.55)}.toast.err svg{color:var(--red)}
.toast.money{border-color:rgba(255,189,56,.55)}.toast.money svg{color:var(--amber)}
.toast.info svg{color:var(--sky)}
#match{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,#081b2c,#05101b);display:flex;justify-content:center;overflow:hidden}
.mi{width:100%;max-width:800px;height:100%;display:flex;flex-direction:column;padding:calc(6px + var(--st)) 10px calc(8px + var(--sb));position:relative;overflow-y:auto}
.mtop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:5px}
.mcomp{font-size:9px;font-weight:900;letter-spacing:.13em;color:var(--lime);text-transform:uppercase}
.mstad{font-size:9.5px;color:var(--dim2);font-weight:700}
.mlive{display:inline-flex;align-items:center;gap:5px;font-size:8.5px;font-weight:900;color:var(--red)}
.mlive i{width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 1.1s infinite}
.mscore{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px}
.mteam{display:flex;flex-direction:column;align-items:center;gap:4px;width:34%;text-align:center}
.mteam b{font-size:11px}
.mnums{display:flex;align-items:center;gap:9px;font-family:Unbounded,sans-serif;font-weight:900;font-size:30px}
.mnums .cl{color:var(--dim2);font-size:21px}
.mnums.pop{animation:sp .7s}
@keyframes sp{30%{transform:scale(1.3);color:var(--lime)}}
.mclock{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.mmin{font-family:Unbounded,sans-serif;font-weight:700;font-size:12px;color:var(--lime);background:rgba(199,255,61,.11);border:1px solid rgba(199,255,61,.4);padding:3px 11px;border-radius:99px}
.mpill{font-size:9px;font-weight:900;padding:3px 8px;border-radius:99px;color:var(--dim);background:rgba(255,255,255,.06);border:1px solid var(--line)}
.mpitch{border-radius:13px;overflow:hidden;border:1px solid var(--line2);background:#0b4429;position:relative;flex:none}
#pitch{width:100%;height:auto;max-height:25vh}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0}
#flash.us{background:radial-gradient(60% 80% at 100% 50%,rgba(199,255,61,.6),transparent 70%)}
#flash.th{background:radial-gradient(60% 80% at 0% 50%,rgba(255,79,104,.6),transparent 70%)}
#flash.on{animation:fg 1s ease-out both}
@keyframes fg{15%{opacity:1}100%{opacity:0}}
#trail{fill:none;stroke:#c7ff3d;stroke-opacity:.4;stroke-width:2}
.mp{cursor:pointer}
.mp .ring{opacity:0}
.mp.act .ring{opacity:1}
.mp.gone{opacity:0;transition:opacity .3s}
.mp text{pointer-events:none}
.ping{animation:pg .8s ease-out both;transform-origin:center;transform-box:fill-box}
@keyframes pg{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(2.6)}}
.leg{display:flex;justify-content:space-between;font-size:9px;font-weight:800;color:var(--dim2);padding:4px 3px 0}
.leg .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.mom{height:6px;border-radius:99px;overflow:hidden;background:var(--s3);display:flex;margin:5px 2px 3px}
.mom i{display:block;height:100%}
.mom .u{background:var(--lime)}
.mom .t{background:var(--red);margin-left:auto}

function pname(){return chance(.45)?pick(FOF)+' '+pick(FOL):pick(RUF)+' '+pick(RUL);}
function value(p){
  var m=LEAGUES[p.lg]?LEAGUES[p.lg].m:1;
  var v=Math.pow(Math.max(10,p.rt-38),2)*8500*m;
  if(p.age<=21)v*=1.3+(p.pot-p.rt)*.025;
  else if(p.age<=27)v*=1.12;
  else if(p.age<=31)v*=.85;
  else v*=.5;
  if(p.home)v*=1.08;
  p.val=Math.max(25000,Math.round(v/5000)*5000);
  p.wage=Math.max(800,Math.round((p.val*.0012+1200)/100)*100);
}
function xpNeed(p){return Math.round(50+p.rt*1.6);}
function gainXP(p,n,focus){
  var mul=1;
  if(has(p,'pro'))mul*=1.22;
  if(has(p,'lazy'))mul*=.72;
  if(has(p,'wonder')&&p.age<=21)mul*=1.35;
  if(p.age<=21)mul*=1+skill('yth')*.08+staff('youth')*.06;
  mul*=1+staff('assist')*.05;
  if(p.age>28)mul*=.5;
  p.xp+=Math.max(0,Math.round(n*mul));
  var ups=0,need=xpNeed(p);
  while(p.xp>=need&&p.rt<p.pot){
    p.xp-=need;p.rt++;ups++;
    var a=1,d=1,s=1;
    if(focus==='atk'){a=2;d=0;}
    if(focus==='def'){a=0;d=2;}
    if(focus==='pac'){s=2;}
    p.atk=clamp(p.atk+a+ri(0,1),1,99);
    p.def=clamp(p.def+d+ri(0,1),1,99);
    p.pac=clamp(p.pac+s,1,99);
    p.sta=clamp(p.sta+1,1,99);
    value(p);need=xpNeed(p);
  }
  if(p.rt>=p.pot)p.xp=Math.min(p.xp,need-1);
  p.grew+=ups;
  return ups;
}
function mkPlayer(lgIdx,base,pos,age,origin,home){
  var rt=clamp(Math.round(base+ri(-4,4)),42,93);
  var pot=clamp(rt+(age<21?ri(6,16):(age<24?ri(3,10):ri(0,4))),rt,96);
  var w={GK:[.2,1,.5],DEF:[.5,1,.8],MID:[.8,.7,.85],ATT:[1,.4,.95]}[pos];
  var tr=[];
  var n=chance(.3)?2:(chance(.6)?1:0);
  for(var i=0;i<n;i++){var t=pick(TRK);if(tr.indexOf(t)<0)tr.push(t);}
  if(age<=19&&rt>=72&&chance(.4)&&tr.indexOf('wonder')<0)tr.push('wonder');
  if(age>=31&&chance(.35)&&tr.indexOf('mentor')<0)tr.push('mentor');
  var p={id:uid(),name:pname(),pos:pos,age:age,rt:rt,pot:pot,
    atk:Math.round(rt*w[0]),def:Math.round(rt*w[1]),pac:Math.round(rt*w[2]),sta:Math.round(rt*.85),
    fit:ri(88,100),mor:ri(64,86),form:6.5,xp:0,grew:0,
    goals:0,ast:0,apps:0,rsum:0,yel:0,susp:0,inj:0,injN:'',
    start:false,listed:false,loan:0,tr:tr,lg:lgIdx,org:origin||'',home:!!home,
    cy:ri(1,4),role:'rot',ret:clamp(39+Math.round((rt-50)/10)+ri(0,5),39,47),nat:ri(0,NATS.length-1)};
  value(p);
  return p;
}

    p.role=i<11?'main':'rot';
    return p;

}

function autoXI(){
  S.squad.forEach(function(p){p.start=false;});
  var pool=S.squad.filter(free);
  var sc=function(p){return p.rt*(.55+p.fit/220)*(.8+p.mor/500);};
  var F=FORMS[S.tac.f],lines={GK:1,DEF:F.DEF,MID:F.MID,ATT:F.ATT};
  var ch=[];
  ['GK','DEF','MID','ATT'].forEach(function(pos){
    var l=pool.filter(function(p){return p.pos===pos&&ch.indexOf(p)<0;});
    l.sort(function(a,b){return sc(b)-sc(a);});
    l.slice(0,lines[pos]).forEach(function(p){ch.push(p);});
  });
  if(ch.length<11){
    var rest=pool.filter(function(p){return ch.indexOf(p)<0;});
    rest.sort(function(a,b){return sc(b)-sc(a);});
    rest.slice(0,11-ch.length).forEach(function(p){ch.push(p);});
  }
  ch.forEach(function(p){p.start=true;});
  if(!S.capt||!ch.some(function(p){return p.id===S.capt;})){
    var s=ch.slice().sort(function(a,b){return (has(b,'leader')?9:0)+b.rt-((has(a,'leader')?9:0)+a.rt);});
    S.capt=s.length?s[0].id:null;
  }
}
function xiNow(){
  var st=S.squad.filter(function(p){return p.start&&free(p);});
  if(st.length===11)return st;
  autoXI();
  return S.squad.filter(function(p){return p.start&&free(p);});
}

function chem(){

  if(!st.length)return 50;

/* ---------- ЛИГИ ---------- */
function fixtures(ids){
  var a=shuffle(ids),n=a.length,rounds=[],rest=a.slice(1);
  for(var r=0;r<n-1;r++){
    var line=[a[0]].concat(rest),pairs=[];
    for(var i=0;i<n/2;i++){
      var h=line[i],w=line[n-1-i];
      if(r%2){var t=h;h=w;w=t;}
      pairs.push({h:h,a:w});
    }
    rounds.push(pairs);
    rest.unshift(rest.pop());
  }
  var back=rounds.map(function(rr){return rr.map(function(p){return {h:p.a,a:p.h};});});
  return rounds.concat(back);
}
function buildLeagues(){
  S.fix=[];S.res=[];
  for(var l=0;l<LEAGUES.length;l++){
    var ids=S.clubs.filter(function(c){return c.lg===l;}).map(function(c){return c.id;});
    S.fix.push(fixtures(ids));
    var rr=[];
    for(var i=0;i<ROUNDS;i++){var m=[];for(var j=0;j<4;j++)m.push(null);rr.push(m);}
    S.res.push(rr);
  }
}
function capLv(cap){var l=1;for(var i=1;i<CAPS.length;i++){if(cap>=CAPS[i])l=i;}return l;}
function table(l){
  var m={};
  S.clubs.forEach(function(c){if(c.lg===l)m[c.id]={id:c.id,p:0,w:0,d:0,ls:0,gf:0,ga:0,pts:0,form:[]};});
  S.res[l].forEach(function(round,r){
    round.forEach(function(res,i){
      if(!res)return;
      var f=S.fix[l][r][i];if(!f)return;
      var H=m[f.h],A=m[f.a];if(!H||!A)return;
      H.p++;A.p++;H.gf+=res.h;H.ga+=res.a;A.gf+=res.a;A.ga+=res.h;
      if(res.h>res.a){H.w++;A.ls++;H.pts+=3;H.form.push('W');A.form.push('L');}
      else if(res.h<res.a){A.w++;H.ls++;A.pts+=3;A.form.push('W');H.form.push('L');}
      else{H.d++;A.d++;H.pts++;A.pts++;H.form.push('D');A.form.push('D');}
    });
  });
  var arr=Object.keys(m).map(function(k){return m[k];});
  arr.sort(function(a,b){return b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf;});
  return arr;
}
function myFix(r){
  var l=lg(),rr=clamp(r,0,ROUNDS-1);
  var idx=-1;
  for(var i=0;i<S.fix[l][rr].length;i++){var f=S.fix[l][rr][i];if(f.h===S.club||f.a===S.club){idx=i;break;}}
  return {l:l,i:idx,f:idx>=0?S.fix[l][rr][idx]:null};
}
function simScore(rh,ra){
  return {h:pois(clamp(1.45+(rh-ra)*.045,.15,3.8)),a:pois(clamp(1.05+(ra-rh)*.045,.1,3.5))};
}
function simRound(r){
  for(var l=0;l<LEAGUES.length;l++){
    S.fix[l][r].forEach(function(f,i){
      if(S.res[l][r][i])return;
      S.res[l][r][i]=simScore(byId(f.h).rating,byId(f.a).rating);
    });
  }
}

function buildCal(){
  var plan=['super','L','L','cup','L','L','int','L','L','cup','L','L','int','L','L','cup','L','L','L','L','nat','nat'];
  var cal=[],lr=0,cr=0,nr=0;
  plan.forEach(function(t){
    if(t==='L'){cal.push({t:'league',r:lr});lr++;}
    else if(t==='cup'){cal.push({t:'cup',r:cr});cr++;}
    else if(t==='nat'){cal.push({t:'nat',r:nr});nr++;}
    else cal.push({t:t,r:0});
  });
  return cal;
}
function wk(){return S.cal[S.week-1]||{t:'off',r:0};}
function brName(r){return ['1/4 финала','1/2 финала','Финал'][r]||'Завершён';}
function weekName(){
  var w=wk();
  if(w.t==='league')return 'Тур '+(w.r+1);
  if(w.t==='cup')return 'Кубок · '+brName(w.r);
  if(w.t==='super')return 'Суперкубок';
  if(w.t==='int')return 'Пауза сборных';
  if(w.t==='nat')return 'Кубок наций';
  return 'Межсезонье';
}
function partner(l){
  for(var i=0;i<PAIRS.length;i++){
    if(PAIRS[i][0]===l)return PAIRS[i][1];
    if(PAIRS[i][1]===l)return PAIRS[i][0];
  }
  return l;
}
function ensureCup(){
  if(!S.cup){
    var ids=S.clubs.filter(function(c){return c.lg===lg();}).map(function(c){return c.id;});
    S.cup={r:0,alive:shuffle(ids),champ:null,lg:lg(),res:[]};
  }
  return S.cup;
}
function cupRound(myWin,myScore){
  var c=ensureCup();
  if(c.r>=3||c.alive.length<2)return;
  var al=c.alive,next=[],out=[];
  for(var i=0;i<al.length;i+=2){
    var h=al[i],a=al[i+1];
    var mine=(h===S.club||a===S.club);
    var hw,hs,as;
    if(mine&&myWin!==null&&myWin!==undefined){
      hw=(h===S.club)?myWin:!myWin;
      hs=myScore?(h===S.club?myScore[0]:myScore[1]):null;
      as=myScore?(h===S.club?myScore[1]:myScore[0]):null;
    }else{
      var sc=simScore(byId(h).rating,byId(a).rating);
      hs=sc.h;as=sc.a;
      hw=hs===as?chance(.5):hs>as;
    }
    out.push({h:h,a:a,hs:hs,as:as,w:hw?h:a,mine:mine});
    next.push(hw?h:a);
  }
  c.alive=next;c.r++;c.res.push(out);
  if(next.length===1){
    c.champ=next[0];
    S.aw.cup[c.lg]=next[0];
    if(next[0]===S.club)winTrophy('Кубок '+LEAGUES[c.lg].n,5,9,'cup');
    else news('trophy','Кубок страны выиграл «'+byId(next[0]).name+'».');
  }
}
function superOpp(){
  var l=lg(),ch=S.aw.ch[l],cu=S.aw.cup[l],ru=S.aw.ru[l];
  if(ch===undefined||ch===null)return null;
  if(S.club===ch){
    if(cu!==undefined&&cu!==null&&cu!==S.club)return cu;
    if(ru!==undefined&&ru!==null&&ru!==S.club)return ru;
    return null;
  }
  if(cu!==undefined&&cu!==null&&S.club===cu)return ch;
  return null;
}
function ensureNatCup(){

var AC=null,MG=null,CROWD=null,MUTE=false;
function audioInit(){
  if(AC)return;
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    AC=new C();
    MG=AC.createGain();
    MG.gain.value=MUTE?0:.5;
    MG.connect(AC.destination);
  }catch(e){}
}
function beep(f,d,t,v,w){
  if(!AC||MUTE)return;
  try{
    var tt=AC.currentTime+(w||0);
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=t||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,tt);
    g.gain.linearRampToValueAtTime(v||.1,tt+.012);
    g.gain.exponentialRampToValueAtTime(.0001,tt+d);
    o.connect(g);g.connect(MG);
    o.start(tt);o.stop(tt+d+.05);
  }catch(e){}
}
function nbuf(){
  var b=AC.createBuffer(1,Math.floor(AC.sampleRate*1.5),AC.sampleRate);
  var d=b.getChannelData(0),l=0;
  for(var i=0;i<d.length;i++){var w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.5;}
  return b;
}
function noise(d,f,v,w){
  if(!AC||MUTE)return;
  try{
    var tt=AC.currentTime+(w||0);
    var s=AC.createBufferSource();s.buffer=nbuf();
    var fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;
    var g=AC.createGain();
    g.gain.setValueAtTime(v,tt);
    g.gain.exponentialRampToValueAtTime(.0001,tt+d);
    s.connect(fl);fl.connect(g);g.connect(MG);
    s.start(tt);s.stop(tt+d+.05);
  }catch(e){}
}
function sndClick(){beep(900,.05,'triangle',.045);}
function sndCash(){beep(660,.08,'sine',.09);beep(880,.12,'sine',.09,.08);}
function sndWhistle(n){for(var i=0;i<n;i++){var d=(i===n-1&&n>1)?.5:.16;beep(2350,d,'square',.04,i*.26);}}
function sndGoal(us){
  var f=us?[220,277,330,440]:[196,233];
  f.forEach(function(x,i){beep(x,.8,'sawtooth',.045,i*.02);});
  noise(1.2,1200,.12);
}
function sndWin(){[392,494,587,784].forEach(function(f,i){beep(f,.45,'triangle',.08,i*.12);});}
function crowdOn(){
  if(!AC||MUTE||CROWD)return;
  try{
    var s=AC.createBufferSource();s.buffer=nbuf();s.loop=true;
    var f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=650;
    var g=AC.createGain();g.gain.value=0;
    s.connect(f);f.connect(g);g.connect(MG);s.start();
    g.gain.linearRampToValueAtTime(.035,AC.currentTime+1.2);
    CROWD={s:s,g:g};
  }catch(e){}
}
function crowdOff(){
  if(!CROWD)return;
  try{
    CROWD.g.gain.setTargetAtTime(0,AC.currentTime,.25);
    var c=CROWD;
    setTimeout(function(){try{c.s.stop();}catch(e){}},900);
  }catch(e){}
  CROWD=null;
}
function setMute(m){
  MUTE=m;
  if(S){S.set.sound=!m;save();}

var fxc=$('#fx'),fctx=fxc.getContext('2d'),parts=[],fxRun=false;
function fxSize(){
  var d=Math.min(2,window.devicePixelRatio||1);
  fxc.width=innerWidth*d;fxc.height=innerHeight*d;
  fctx.setTransform(d,0,0,d,0,0);
}
window.addEventListener('resize',fxSize);
fxSize();
function burst(x,y,n){
  var cols=['#c7ff3d','#ffffff','#ffbd38','#35b9ff','#e45cff','#2fd487'];
  for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:rnd(-5,5),vy:rnd(-9,-2),r:rnd(0,6),vr:rnd(-.2,.2),s:rnd(4,8),c:pick(cols),l:rnd(50,90)});
  if(!fxRun){fxRun=true;requestAnimationFrame(fxLoop);}
}
function fxLoop(){
  fctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(function(p){return p.l>0;});
  parts.forEach(function(p){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.r+=p.vr;p.l--;
    fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);
    fctx.globalAlpha=clamp(p.l/40,0,1);fctx.fillStyle=p.c;
    fctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);fctx.restore();
  });
  if(parts.length)requestAnimationFrame(fxLoop);
  else{fxRun=false;fctx.clearRect(0,0,innerWidth,innerHeight);}
}

  else if(gap<=24)o={k:3,n:'Топ-клуб',rep:82,board:80,inte:89,tro:3,sea:3,wk:40,base:.012,c:'#ffbd38',lic:3};
  else o={k:4,n:'Мировой гранд',rep:93,board:88,inte:96,tro:5,sea:4,wk:54,base:.005,c:'#e45cff',lic:3};

function callups(){
  var cands=S.squad.slice().sort(function(a,b){return b.rt-a.rt;}).slice(0,8);
  var list=[];
  shuffle(cands).slice(0,ri(2,4)).forEach(function(p){
    p.mor=clamp(p.mor+6,0,100);
    p.fit=clamp(p.fit-6,35,100);
    list.push(p.name);
  });
  if(list.length){news('globe','Вызов в сборные: '+list.join(', '));rep(1);}
}
function weekly(){
  S.inbox=S.inbox.filter(function(i){return i.exp>=S.week;});
  if(S.jobCd>0)S.jobCd--;
  if(S.offCd>0)S.offCd--;
  if(S.spCd>0)S.spCd--;
  interest(-.35);
  if(S.build){
    S.build.w--;
    if(S.build.w<=0){
      var c=club();
      c.cap=CAPS[S.build.lv];c.stLv=S.build.lv;c.fans=Math.round(c.cap*.72);
      news('stadium','Стадион расширен до '+num(c.cap)+' мест');
      toast('Стадион готов','ok');
      S.build=null;
    }
  }
  S.squad.forEach(function(p){
    if(p.loan>0){
      p.loan--;
      if(p.loan<=0){
        var g=ri(0,2);
        p.rt=clamp(p.rt+g,1,p.pot);
        p.mor=clamp(p.mor+6,0,100);
        value(p);
        news('swap',p.name+' вернулся из аренды'+(g?' (+'+g+')':''));
      }
    }
    var h=happy(p);
    p.mor=clamp(Math.round(p.mor*.88+h.v*.12),10,100);
    if(p.inj>0&&chance(.35+staff('physio')*.08))p.inj--;
    if(p.susp>0)p.susp--;
  });
  if(chance(.5)&&S.market.length<40)S.market.push(mkMarketOne());
  if(S.market.length>40)S.market=S.market.slice(-40);
  var n=1+(chance(.7)?1:0);
  for(var k=0;k<n;k++){
    if(S.squad.length<=14)break;
    var pool=S.squad.filter(function(p){
      return !S.inbox.some(function(i){return i.t==='sale'&&i.p.pid===p.id;});
    });
    if(!pool.length)break;
    var pl=pick(pool);
    var bu=S.clubs.filter(function(x){return x.id!==S.club&&x.budget>pl.val*.35;});
    if(!bu.length)continue;
    var b=pick(bu);
    var am=Math.max(50000,Math.round(pl.val*rnd(pl.listed?.95:.8,pl.listed?1.5:1.35)/10000)*10000);
    inbox('sale',{pid:pl.id,buyer:b.name,amount:am,counter:false},3);
    news('swap','«'+b.name+'» предлагает '+money(am)+' за '+pl.name);
  }
  if(S.squad.length>14&&chance(.28)){
    var un=S.squad.filter(function(p){
      return !p.start&&p.mor<72&&!S.inbox.some(function(i){return i.t==='req'&&i.p.pid===p.id;});
    });
    if(un.length){
      var p=pick(un);
      p.mor=clamp(p.mor-8,10,100);
      inbox('req',{pid:p.id,why:pick(['хочет играть в основе','недоволен ролью запасного','мечтает о еврокубках','хочет сменить обстановку'])},3);
      news('alert',p.name+' попросил трансфер.');
    }
  }
  jobOffer();
  if(!S.nat&&S.rep>=40&&chance(.22)&&!S.inbox.some(function(i){return i.t==='nat';})){
    var na=ri(0,NATS.length-1);
    inbox('nat',{n:na},5);
    news('globe','Федерация '+NATS[na][0]+' приглашает вас.');
  }
  if(!S.sponsor&&chance(.4)&&!S.inbox.some(function(i){return i.t==='sp';})){
    inbox('sp',{vars:spOffers()},4);
  }
  if(chance(.16))inbox('press',pick(PRESS),2);
  var ffp=wages()*40;
  var inc=(S.sponsor?S.sponsor.weekly:0)*40+club().cap*S.ticket*.5;
  if(ffp>inc*1.4&&chance(.25)){
    S.board=clamp(S.board-3,0,100);
    news('alert','FFP: зарплаты превышают доходы. Совет недоволен.');
  }
}
function advance(){
  var w=wk();
  if(w.t==='league')simRound(w.r);
  if(w.t==='cup'){
    var c=ensureCup();
    if(c.alive.indexOf(S.club)<0&&c.r<3)cupRound(null,null);
  }

}

function finishSeason(){
  if(wk().t!=='off')return;
  var old=lg(),t=table(old),pos=1,row=null;
  for(var i=0;i<t.length;i++){if(t[i].id===S.club){pos=i+1;row=t[i];}}
  var prize=Math.round((PRIZE[pos-1]||1e6)*LEAGUES[old].m);
  S.money+=prize;
  S.stats.seasons++;
  for(var l=0;l<LEAGUES.length;l++){
    var tt=table(l);
    S.aw.ch[l]=tt[0].id;
    S.aw.ru[l]=tt[1].id;
  }
  if(S.cup&&S.cup.champ===null){
    var g=0;
    while(S.cup.r<3&&S.cup.alive.length>1&&g<4){cupRound(null,null);g++;}
  }
  var promoted=false,relegated=false,newLg=LEAGUES[old].n;
  PAIRS.forEach(function(pr){
    var top=pr[0],sec=pr[1];
    var down=table(top).slice(-2).map(function(r){return r.id;});
    var up=table(sec).slice(0,2).map(function(r){return r.id;});
    for(var i=0;i<2;i++){
      var dc=byId(down[i]),uc=byId(up[i]);
      if(!dc||!uc)continue;
      dc.lg=sec;uc.lg=top;
      if(uc.id===S.club){promoted=true;newLg=LEAGUES[top].n;}
      if(dc.id===S.club){relegated=true;newLg=LEAGUES[sec].n;}
    }
  });
  var c=club(),spNote='';
  if(S.sponsor&&S.sponsor.obj){
    var ok=(S.sponsor.obj==='promo'&&promoted)||(S.sponsor.obj==='top4'&&pos<=4);
    if(ok){
      var bon=Math.round(S.sponsor.sign*.45);
      S.money+=bon;S.spEarn+=bon;
      spNote='Спонсор выплатил бонус: '+money(bon);
    }else{
      var pen=Math.round(S.sponsor.sign*.5);
      S.money-=pen;
      spNote='Спонсор удержал штраф: '+money(pen);
    }
  }
  if(promoted){
    c.budget=Math.round(c.budget*1.45);
    var bo=Math.round(c.budget*.35+12e6);
    S.money+=bo;
    S.fans=clamp(S.fans+12,0,100);
    winTrophy('Выход в '+newLg,7,13,'promo');
  }else if(relegated){
    c.budget=Math.round(c.budget*.65);
    rep(-9);S.board=clamp(S.board-14,0,100);interest(-20);
    news('alert','«'+c.name+'» вылетает в '+newLg);
  }else if(pos===1&&LEAGUES[old].t===1){
    winTrophy('Чемпион '+LEAGUES[old].n,8,16,'champ');
  }else if(pos<=2){interest(7);rep(3);}
  else if(pos<=4){interest(3);}
  else interest(-6);
  S.hist.unshift({s:S.season,club:c.name,lg:LEAGUES[old].n,pos:pos,pts:row?row.pts:0,up:promoted,dn:relegated});
  var intake=Math.max(1,S.acad-1+Math.floor(staff('youth')/2));
  for(var g2=0;g2<intake;g2++){
    if(S.squad.length<24){
      var y=mkYouth(c);
      S.squad.push(y);
      news('sprout','Академия выпустила '+y.name+' ('+y.rt+')');
    }
  }
  var retired=[];
  S.squad.forEach(function(p){
    p.age++;
    if(p.age>=30){p.pac=clamp(p.pac-ri(1,2),20,99);p.sta=clamp(p.sta-ri(0,2),20,99);}
    if(p.age>=31&&chance(.3))p.rt=clamp(p.rt-1,40,99);
    p.fit=100;p.mor=clamp(p.mor+10,40,100);
    p.inj=0;p.susp=0;p.yel=0;p.goals=0;p.ast=0;p.apps=0;p.rsum=0;
    p.start=false;p.listed=false;p.xp=0;
    p.cy=Math.max(0,p.cy-1);
    value(p);
  });
  S.squad=S.squad.filter(function(p){
    if(p.age>=p.ret){retired.push(p);return false;}
    return true;
  });
  retired.forEach(function(p){
    var y=mkYouth(c);
    y.pos=p.pos;y.age=ri(17,19);
    S.squad.push(y);

  });
  var expired=S.squad.filter(function(p){return p.cy<=0;});
  expired.forEach(function(p){
    var h=happy(p).v;
    if(h>=55&&chance(.6)&&S.money>p.wage*40){
      p.cy=ri(2,3);
      p.wage=Math.round(p.wage*1.12/100)*100;
      news('doc',p.name+' продлил контракт.');
    }else{
      S.squad=S.squad.filter(function(x){return x.id!==p.id;});
      news('alert',p.name+' ушёл свободным агентом.');
    }
  });
  while(S.squad.length<16)S.squad.push(mkYouth(c));
  if(S.nat){
    S.nat.squad.forEach(function(p){p.age++;p.fit=100;p.goals=0;p.apps=0;p.xp=0;p.cy=2;value(p);});
    S.nat.squad=S.nat.squad.filter(function(p){return p.age<p.ret;});
    while(S.nat.squad.length<18){
      var np=mkPlayer(0,NATS[S.nat.n][2]+ri(-6,2),pick(['GK','DEF','MID','ATT']),ri(19,26),NATS[S.nat.n][0],false);
      np.nat=S.nat.n;
      S.nat.squad.push(np);
    }
  }
  autoXI();
  S.season++;S.week=1;
  S.sponsor=null;S.spEarn=0;S.nc=null;S.nf=null;S.cup=null;
  S.market=mkMarket(26);
  buildLeagues();
  S.cal=buildCal();
  S.inbox=[];S.trained=0;
  U.lg=null;U.rd=null;
  S.mh.push(S.money);
  inbox('sp',{vars:spOffers()},5);
  inbox('info',{title:'Сезон '+S.season,text:'Призовые: '+money(prize)+'. '+(spNote||'Контракт со спонсором истёк.')},7);
  weekly();achCheck();save();render();
  var h='<div class="mt">'+I('trophy',17)+' Итоги сезона '+(S.season-1)+'</div>';
  var cls=pos<=2?'w':(pos>=7?'l':'d');
  h+='<div class="sumh '+cls+'">'+pos+'-е место</div>';
  h+='<div class="sums">'+esc(c.name)+' · '+(row?row.pts:0)+' очков · '+money(prize)+'</div>';
  h+='<div class="sumg">';
  h+='<div class="sc2"><div class="l">Статус</div><div class="v">'+(promoted?'Повышение':(relegated?'Вылет':'Сохранение'))+'</div></div>';
  h+='<div class="sc2"><div class="l">Лига</div><div class="v">'+esc(newLg)+'</div></div>';
  h+='<div class="sc2"><div class="l">Интерес</div><div class="v">'+Math.round(S.interest)+'</div></div>';
  h+='<div class="sc2"><div class="l">Репутация</div><div class="v">'+Math.round(S.rep)+'</div></div>';
  h+='</div>';
  if(retired.length)h+='<p class="dim" style="font-size:12px;margin-bottom:10px">Завершили карьеру: '+retired.map(function(p){return esc(p.name);}).join(', ')+'</p>';
  if(spNote)h+='<p class="dim" style="font-size:12px;margin-bottom:10px">'+esc(spNote)+'</p>';
  h+=btn('close','Начать сезон '+S.season,'btn-p btn-block');
  modal(h);

/* ---------- ТАКТИКА ---------- */
function tacMod(){
  var t=S.tac,F=FORMS[t.f];
  var line=(t.line-50)/50,press=(t.press-50)/50,tempo=(t.tempo-50)/50,width=(t.width-50)/50;
  var a=line*3+tempo*3.4+width*1.6;
  var d=-line*3.6+press*2.6-tempo*.6;
  var r=line*.03+tempo*.022+press*.014;
  var dr=press*.09+tempo*.07+line*.03;
  var po=-tempo*4-line*1.5;
  if(t.trap){if(t.line>60)d+=2.4;else d-=2.2;}
  if(t.cpress){a+=1.6;dr+=.09;}
  if(F.ATT>=3)a+=1.2;
  if(F.DEF>=5)d+=1.4;
  if(F.MID>=5)po+=2.5;
  var fam=S.fam[t.f]||30;
  var fm=(fam-70)/30*2.2;
  a+=fm+skill('tac')*1.5;
  d+=fm+skill('tac')*1.5;
  return {a:a,d:d,r:r,dr:dr,po:po,fam:fam};
}
function teamCalc(xi){
  var aw=0,as=0,dw=0,ds=0;
  var wa={GK:.02,DEF:.15,MID:.55,ATT:1},wd={GK:1,DEF:1,MID:.45,ATT:.12};
  xi.forEach(function(p){
    aw+=wa[p.pos];as+=p.atk*wa[p.pos];
    dw+=wd[p.pos];ds+=p.def*wd[p.pos];
  });
  var mi=xi.filter(function(p){return p.pos==='MID';});
  var mid=0;
  if(mi.length){mi.forEach(function(p){mid+=p.rt;});mid/=mi.length;}
  else{xi.forEach(function(p){mid+=p.rt;});mid/=Math.max(1,xi.length);}
  var fit=0,mor=0;
  xi.forEach(function(p){fit+=p.fit;mor+=p.mor;});
  return {a:as/Math.max(.1,aw),d:ds/Math.max(.1,dw),mid:mid,fit:fit/Math.max(1,xi.length),mor:mor/Math.max(1,xi.length)};
}
function oppXI(rating,names){
  var F=FORMS[pick(Object.keys(FORMS))];
  var need={GK:1,DEF:F.DEF,MID:F.MID,ATT:F.ATT};
  var out=[],pool=(names||[]).slice();
  while(pool.length<14)pool.push(pname());
  var id=0;
  ['GK','DEF','MID','ATT'].forEach(function(pos){
    for(var i=0;i<need[pos];i++){
      var r=rating+ri(-5,4);
      id++;
      out.push({id:'o'+id,name:pool.shift(),pos:pos,rt:r,atk:r,def:r,pac:r,sta:r,fit:100,mor:75,tr:[],num:id});
    }
  });
  return out;
}

      stad:'Национальный стадион · '+num(ri(30000,65000)),oc:null};

  var stad=home?c.st:oc.st;

    usName:'«'+c.name+'»',usColor:c.c1,usBadge:badge(c,40),opBadge:badge(oc,40),
    stad:stad+' · '+num(att),oc:oc};
}

function slot(p,side){

function visual(){
  if(!M)return;
  cancelAnimationFrame(M.raf);
  var loop=function(){
    if(!M)return;
    try{
      if(M.state!=='end'){
        var t=performance.now();
        var sh=clamp(M.mom*.25,-28,28);
        var pr=M.ua>6?5:(M.ua<-3?-4:0);
        ['us','op'].forEach(function(side){
          M.vis[side].forEach(function(v){
            var lw={GK:.12,DEF:.5,MID:1,ATT:1.25}[v.p.pos]||1;
            var dir=side==='us'?1:-1;
            var tx=v.bx+sh*lw+pr*dir*lw+Math.sin(t/850+v.i*1.3)*2.4;
            var ty=v.by+Math.cos(t/1200+v.i*1.7)*3.4;
            v.x+=(tx-v.x)*.08;v.y+=(ty-v.y)*.08;
            v.el.setAttribute('transform','translate('+v.x.toFixed(1)+','+v.y.toFixed(1)+')');
            if(side==='us'){
              var f=liveFit(v.p);
              v.ring.setAttribute('stroke',f>=70?'#c7ff3d':(f>=50?'#ffbd38':'#ff4f68'));
            }
          });
        });
        var tx2,ty2,tA=null;
        if(M.act&&t-M.act.t<1400){
          M.vis[M.act.side].forEach(function(v){if(String(v.p.id)===M.act.id)tA=v;});
        }
        if(M.anim){
          var g=M.anim,q=clamp((t-g.t)/700,0,1);
          tx2=g.fx+(g.tx-g.fx)*q;ty2=g.fy+(g.ty-g.fy)*q;
          if(q>=1)M.anim=null;
        }else if(tA){tx2=tA.x+(tA.side==='us'?9:-9);ty2=tA.y;}
        else{tx2=180+sh*1.6+Math.sin(t/640)*18;ty2=118+Math.sin(t/1040)*30;}
        M.bx+=(clamp(tx2,10,350)-M.bx)*.14;
        M.by+=(clamp(ty2,10,226)-M.by)*.14;
        M.trail.push([M.bx.toFixed(1),M.by.toFixed(1)]);
        if(M.trail.length>10)M.trail.shift();
        $('#trail').setAttribute('points',M.trail.map(function(p){return p.join(',');}).join(' '));
        $('#ball').setAttribute('cx',M.bx);$('#ball').setAttribute('cy',M.by);
        $('#ballG').setAttribute('cx',M.bx);$('#ballG').setAttribute('cy',M.by);
        $('#mDir').textContent=M.mom>6?'атака':(M.mom<-6?'защита':'баланс');
      }
    }catch(e){}
    M.raf=requestAnimationFrame(loop);
  };
  M.raf=requestAnimationFrame(loop);
}

function short(p){var a=p.name.split(' ');return a[a.length-1]||p.name;}
function scorer(){
  var pool=M.us.players.filter(function(p){return p.pos!=='GK';});
  if(!pool.length)return M.us.players[0];
  var w=pool.map(function(p){
    var base=Math.pow(p.atk,2)*(p.pos==='ATT'?2:(p.pos==='MID'?1:.3));
    if(has(p,'clutch')&&M.ko)base*=1.4;
    return base;
  });
  var s=0;w.forEach(function(x){s+=x;});
  var r=Math.random()*s;
  for(var i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i];}
  return pool[0];
}
function usA(){
  var v=M.us.a+MENT[S.tac.men].a+M.ua+(M.home?2:0)+M.mom*.05+(M.us.mor-70)*.06+chem()*.02+skill('mot');
  return M.red?v*.85:v;
}
function usD(){
  var v=M.us.d+MENT[S.tac.men].d+M.ud+(M.home?1:0)+(M.us.mor-70)*.04+chem()*.015;
  return M.red?v*.85:v;
}
function shot(us){
  var side=us?0:1;
  var atk=us?usA():M.op.a+M.op.ma-M.mom*.04;
  var def=us?M.op.d+M.op.md:usD();
  var risk=us?MENT[S.tac.men].r+M.ur*.004:.03;
  var pool=us?M.us.players:M.op.players;
  var sh=us?scorer():pick(pool.filter(function(p){return p.pos!=='GK';}));
  if(!sh)sh=pool[0];
  highlight(us?'us':'op',sh.id);
  ping(M.bx,M.by,us?'#c7ff3d':'#ff4f68');
  M.sh[side]++;
  var pG=clamp(.26+(atk-def)*.006+risk,.05,.62);
  M.xg[side]+=pG;
  M.map.push({us:us,x:clamp(M.bx,10,350),y:clamp(M.by,10,226),g:false});
  if(chance(pG)){
    M.score[side]++;M.so[side]++;
    M.mom+=us?9:-9;
    M.map[M.map.length-1].g=true;
    M.anim={t:performance.now(),fx:M.bx,fy:M.by,tx:us?352:8,ty:118};
    flash(us);
    ping(us?352:8,118,us?'#c7ff3d':'#ff4f68');
    if(us){
      M.goals.push(sh.id);
      M.byGoal[sh.id]=(M.byGoal[sh.id]||0)+1;
      if(M.ratings[sh.id]){M.ratings[sh.id].g++;M.ratings[sh.id].r+=1.1;}
      feed(M.min,'ball','ГОЛ! '+sh.name+' отправляет мяч в сетку.','goal');
      banner('ГОЛ!',true);
      sndGoal(true);
      burst(innerWidth/2,innerHeight*.3,60);
    }else{
      feed(M.min,'ball','Гол соперника: '+sh.name,'gl');
      banner('ГОЛ СОПЕРНИКА',false);
      sndGoal(false);
      var gk=M.us.players.filter(function(p){return p.pos==='GK';})[0];
      if(gk&&M.ratings[gk.id])M.ratings[gk.id].r-=.35;
    }
  }else{
    if(chance(.45)){
      M.so[side]++;
      feed(M.min,'shield','Вратарь тянет удар '+short(sh),'');
      if(!us){
        var gk2=M.us.players.filter(function(p){return p.pos==='GK';})[0];
        if(gk2&&M.ratings[gk2.id])M.ratings[gk2.id].r+=.25;
      }
    }else feed(M.min,'target',short(sh)+' бьёт рядом со штангой','');
    M.mom+=us?2:-2;
  }
}
function cardEvent(){
  var us=chance(.5);
  var pool=(us?M.us.players:M.op.players).filter(function(p){return p.pos!=='GK';});
  if(!pool.length)return;
  var p=pick(pool);
  var red=chance(.1*(has(p,'temper')?1.8:1));
  showCard(us?'us':'op',p.id,red);
  if(us&&M.ratings[p.id])M.ratings[p.id].r-=red?1.2:.3;
  if(red){
    if(us){
      if(M.red)return;
      M.red=true;
      feed(M.min,'alert','Красная карточка. '+p.name+' удалён.','big');
      var sp=S.squad.find(function(x){return x.id===p.id;});
      if(sp)sp.susp=ri(1,3);
    }else{
      if(M.op.red)return;
      M.op.red=true;M.op.ma-=6;M.op.md-=4;

      }

  }
}

    return M.subbed.indexOf(p.id)<0&&!M.us.players.some(function(x){return x.id===p.id;});
  });
  function sc(p,side){
    var f=side==='out'?liveFit(p):p.fit;
    var rt=M.ratings[p.id]?M.ratings[p.id].r.toFixed(1):'6.5';
    var h='<button class="sc '+(M.subOut===p.id?'sel':'')+'" data-a="'+(side==='out'?'subout':'subin')+'" data-id="'+p.id+'">';

    h+='<span class="grow"><span class="nm">'+esc(p.name)+'</span>';
    h+='<span class="mt2">'+(side==='out'?Math.round(f)+'% · '+rt:'свежий · '+p.age)+' лет</span></span></button>';
    return h;
  }
  var left='',right='';
  M.us.players.forEach(function(p){left+=sc(p,'out');});
  if(bench.length)bench.forEach(function(p){right+=sc(p,'in');});

function doSub(outId,inId){

  for(var i=0;i<M.us.players.length;i++){if(String(M.us.players[i].id)===String(outId)){oi=i;break;}}
  var np=null;
  M.us.bench.forEach(function(p){if(String(p.id)===String(inId))np=p;});
  if(oi<0||!np)return;
  var op=M.us.players[oi];
  if((op.pos==='GK')!==(np.pos==='GK')){toast('Вратаря меняем только на вратаря','err');return;}
  M.us.players[oi]=np;
  M.subbed.push(op.id);
  if(M.pm[op.id])M.pm[op.id].o=M.min;
  M.pm[np.id]={i:M.min,o:999};

  rebase();

function limit(){return M.et?(M.etHalf?122:107):(90+M.added);}
function tick(){
  if(!M||M.state==='end')return;
  try{
    if(M.state==='dec'){
      var left=Math.ceil(15-(performance.now()-M.decT)/1000);
      var e=$('#autoT');
      if(e)e.textContent='авто '+Math.max(0,left)+'с';
      if(left<=0)decResolve(autoIdx(M.dec.key),true);
      return;
    }
    if(M.state!=='run')return;
    M.min++;
    if(M.min>=limit()){M.min=limit();hud();endPhase();return;}
    var due=null;
    for(var i=0;i<M.sched.length;i++){
      if(M.sched[i].m===M.min&&!M.sched[i].done){due=M.sched[i];break;}
    }
    if(due){due.done=true;decTrigger(due.k);return;}
    if(M.min===46)feed(45,'whistle','Второй тайм начался','big');
    var tm=tacMod();
    var po=clamp(.5+(M.us.mid-M.op.mid)*.004+M.mom*.002+tm.po*.01,.28,.72);
    M.pAcc+=po;M.pN++;
    if(chance(.16*(.88+.12*(M.us.fit/100))))shot(chance(po));
    if(chance(.016))cardEvent();
    if(chance(.05))feed(M.min,'ball',pick(['Плотная борьба в центре поля.','Трибуны гонят команду вперёд.','Затяжная атака, оборона трещит.','Мяч ходит от фланга к флангу.','Стандарт у наших ворот, выносим.']),'');
    M.mom*=.965;
    M.us.fit=Math.max(28,M.us.fit-(.2+M.udr));
    hud();
  }catch(e){
    console.error(e);
    M.state='run';M.dec=null;
    $('#dec').classList.add('hidden');
  }
}
function fastForward(){
  if(!M||M.state==='end')return;
  M.state='run';M.dec=null;
  $('#dec').classList.add('hidden');
  var g=0;
  while(M&&M.state!=='end'&&g<600){
    g++;M.min++;
    if(M.min>=limit()){M.min=limit();endPhase();break;}
    var tm=tacMod();
    var po=clamp(.5+(M.us.mid-M.op.mid)*.004+tm.po*.01,.28,.72);
    M.pAcc+=po;M.pN++;
    if(chance(.16))shot(chance(po));
    if(chance(.014))cardEvent();
    M.mom*=.965;
    M.us.fit=Math.max(28,M.us.fit-(.2+M.udr));
  }
  if(M&&M.state!=='end')endPhase();
}
function endPhase(){

    banner('ДОП. ВРЕМЯ',true);

    return;
  }
  if(M.et&&!M.etHalf){
    M.etHalf=true;M.min=106;M.state='run';
    feed(105,'whistle','Второй тайм дополнительного времени','big');
    hud();

  }

}
function shootout(){
  var pk=S.squad.find(function(p){return p.id===S.pk;});
  var bonus=pk?(pk.atk-70)*.004:0;
  var uq=clamp(.74+(M.us.a-72)*.004+bonus,.5,.93);
  var oq=clamp(.74+(M.op.a-72)*.004,.5,.92);
  var a=0,b=0,ua=[],oa=[];
  for(var i=0;i<5;i++){
    var u=chance(uq);ua.push(u);if(u)a++;
    var o=chance(oq);oa.push(o);if(o)b++;
    if(a>b+(4-i)||b>a+(4-i))break;
  }
  var g=0;
  while(a===b&&g<10){
    g++;
    var u2=chance(uq),o2=chance(oq);
    ua.push(u2);oa.push(o2);
    if(u2)a++;
    if(o2)b++;
  }
  if(a===b){if(chance(.5))a++;else b++;}
  M.pens={u:ua,o:oa,s:[a,b]};
  return a>b;
}
function ratings(res){
  var out=[];
  Object.keys(M.ratings).forEach(function(id){
    var r=M.ratings[id],p=null;
    M.us.players.forEach(function(x){if(String(x.id)===String(id))p=x;});
    if(!p)S.squad.forEach(function(x){if(String(x.id)===String(id))p=x;});
    if(!p&&S.nat)S.nat.squad.forEach(function(x){if(String(x.id)===String(id))p=x;});
    if(!p)return;
    var pm=M.pm[id];
    var mn=pm?clamp((pm.o===999?M.min:pm.o)-pm.i,0,125):0;
    var base=6.2+(p.rt-70)*.035+r.g*1.1+r.a*.6+(mn/90)*.35;
    if(res==='W')base+=.5;
    if(res==='L')base-=.45;
    base=clamp(base+rnd(-.35,.35),3.5,10);
    out.push({id:p.id,name:p.name,pos:p.pos,r:Math.round(base*10)/10,g:r.g,a:r.a,min:mn});
  });
  out.sort(function(a,b){return b.r-a.r;});
  return out;
}
function clubEffects(res,us,op,gateF){
  var grew=[],rt=ratings(res),motm=rt[0];
  Object.keys(M.pm).forEach(function(id){
    var sp=S.squad.find(function(x){return String(x.id)===String(id);});
    if(!sp)return;
    var pm=M.pm[id];
    var mn=clamp((pm.o===999?M.min:pm.o)-pm.i,0,125);
    if(mn<=0)return;
    sp.apps++;
    sp.fit=clamp(sp.fit-ri(6,13)-mn*.05+staff('fit')*1.6,30,100);
    sp.mor=clamp(sp.mor+(res==='W'?5:(res==='D'?1:-5)),15,100);
    var r=null;
    rt.forEach(function(x){if(String(x.id)===String(id))r=x;});
    if(r){
      sp.rsum+=r.r;
      sp.form=Math.round((sp.form*3+r.r)/4*10)/10;
      if(motm&&motm.id===sp.id&&r.r>=8.5)sp.mor=clamp(sp.mor+2,15,100);
    }
    if(!sp.inj&&chance(.016*(has(sp,'glass')?1.9:(has(sp,'iron')?.5:1))*(1-S.med*.07))){
      var t=injPick();
      sp.inj=Math.max(1,Math.round(t.w*(1-staff('physio')*.09)));
      sp.injN=t.n;
      news('med',sp.name+': '+t.n+' — '+sp.inj+' нед.');
    }
    var g=gainXP(sp,Math.round(mn*.12)+(res==='W'?4:2),'');
    if(g)grew.push(sp.name+' +'+g);
  });
  M.goals.forEach(function(id){
    var p=S.squad.find(function(x){return String(x.id)===String(id);});
    if(!p)return;
    p.goals++;
    if(chance(.6)){
      var a=pick(M.us.players.filter(function(x){return x.id!==id&&x.pos!=='GK';}));
      if(a){
        var ap=S.squad.find(function(x){return x.id===a.id;});
        if(ap){ap.ast++;if(M.ratings[a.id])M.ratings[a.id].a++;}
      }
    }
  });
  S.squad.filter(function(p){return !p.start;}).forEach(function(p){p.fit=clamp(p.fit+5+staff('fit'),0,100);});
  S.fam[S.tac.f]=clamp((S.fam[S.tac.f]||30)+8,0,100);
  Object.keys(S.fam).forEach(function(f){if(f!==S.tac.f)S.fam[f]=clamp(S.fam[f]-1,10,100);});
  if(grew.length)news('up','Рост после матча: '+grew.join(', '));
  var c=club();
  var att=clamp(.5+S.fans/200-(S.ticket-22)*.012,.35,1);
  var gate=Math.round(Math.min(c.cap,c.fans*att)*S.ticket*LEAGUES[lg()].m*gateF*.9);
  var sp=0;
  if(S.sponsor){
    sp=S.sponsor.weekly;
    if(S.sponsor.pw&&res==='W')sp+=S.sponsor.pw;
    if(S.sponsor.pg)sp+=S.sponsor.pg*us;
    S.spEarn+=sp;
  }
  var income=sp+gate-wages();
  S.money+=income;
  S.mh.push(S.money);
  if(S.mh.length>26)S.mh.shift();
  if(sp>0)news('pct','Спонсор «'+S.sponsor.brand+'» выплатил '+money(sp));
  S.clean=op===0?S.clean+1:0;
  return {income:income,rt:rt};
}
function injPick(){
  var r=Math.random(),acc=0;
  for(var i=0;i<INJS.length;i++){
    acc+=INJS[i].p;
    if(r<=acc)return {n:INJS[i].n,w:ri(INJS[i].a,INJS[i].b)};
  }
  return {n:'Ушиб',w:1};
}

      simRound(M.ctx.r);

      }else news('alert','Суперкубок упущен.');
    }
    S.money+=prize;
    news(res==='W'?'fire':'alert',M.us.name+' '+us+':'+op+' '+M.op.name);
  }else{
    var nj=S.nat;
    nj.stats.m++;nj.stats.gf+=us;nj.stats.ga+=op;
    if(res==='W')nj.stats.w++;
    else if(res==='D')nj.stats.d++;
    else nj.stats.l++;
    Object.keys(M.pm).forEach(function(id){
      var sp=nj.squad.find(function(x){return String(x.id)===String(id);});
      if(!sp)return;
      var pm=M.pm[id];
      var mn=clamp((pm.o===999?M.min:pm.o)-pm.i,0,125);
      if(mn<=0)return;
      sp.apps++;
      sp.fit=clamp(sp.fit-ri(6,12),35,100);
      sp.mor=clamp(sp.mor+(res==='W'?6:(res==='D'?1:-4)),20,100);
      gainXP(sp,Math.round(mn*.1)+(res==='W'?4:2),'');
    });
    M.goals.forEach(function(id){
      var p=nj.squad.find(function(x){return String(x.id)===String(id);});
      if(p)p.goals++;
    });
    if(t==='nat'){
      var nc=ensureNatCup();
      if(nc.stage==='semi'){
        if(res==='W'){nc.stage='final';nc.opp=nc.opp2;news('trophy',NATS[nj.n][0]+' в финале Кубка наций!');}
        else{
          nc.stage='third';

        }

        winTrophy('Кубок наций · '+NATS[nj.n][0],7,14,'nat');

        news('trophy',NATS[nj.n][0]+' — бронза Кубка наций.');
      }

    rt=ratings(res);
    news('globe',M.us.name+' '+us+':'+op+' '+M.op.name+' · сборная');
  }
  advance();

A.train=function(){
  if(S.trained===S.week){toast('Тренировка уже проведена','info');return;}
  var f=S.focus,it=S.inten;
  var mul=(1+S.base*.08)*[.6,1,1.35,1.7][it];
  var grew=[];
  function push(p,base,focus){
    var g=gainXP(p,Math.round(base*mul*rnd(.85,1.25)),focus);
    if(g)grew.push(p.name+' +'+g);
  }
  var injP=[.01,.03,.06,.1][it]*(1-S.med*.07);
  if(f==='atk')S.squad.filter(function(p){return p.pos==='ATT'||p.pos==='MID';}).forEach(function(p){push(p,26,'atk');p.fit=clamp(p.fit-3*it,25,100);});
  if(f==='def')S.squad.filter(function(p){return p.pos==='DEF'||p.pos==='GK';}).forEach(function(p){push(p,26,'def');p.fit=clamp(p.fit-3*it,25,100);});
  if(f==='fit')S.squad.forEach(function(p){p.fit=clamp(p.fit+Math.round(8*mul),0,100);push(p,14,'pac');});
  if(f==='rest')S.squad.forEach(function(p){p.fit=clamp(p.fit+Math.round(13*(1+staff('fit')*.1)),0,100);p.mor=clamp(p.mor+4,0,100);if(p.inj>0)p.inj--;push(p,6,'');});
  if(f==='youth')S.squad.filter(function(p){return p.age<=21;}).forEach(function(p){push(p,34,'');p.mor=clamp(p.mor+3,0,100);});
  S.squad.forEach(function(p){
    if(!p.inj&&chance(injP*(has(p,'glass')?1.9:(has(p,'iron')?.5:1)))){
      var t=injPick();
      p.inj=Math.max(1,Math.round(t.w*(1-staff('physio')*.09)));
      p.injN=t.n;
      news('med',p.name+' травмировался: '+t.n);
    }
  });
  S.squad.forEach(value);
  S.trained=S.week;
  autoXI();
  news('gym','Тренировка проведена.'+(grew.length?' Прогресс: '+grew.join(', '):''));
  save();render();achCheck();
  if(grew.length){toast('Прогресс: '+grew[0],'ok');burst(innerWidth/2,innerHeight*.3,40);}
  else toast('Опыт начислен','ok');
};

};

  if(p){p.listed=!p.listed;save();closeModal();render();toast(p.listed?'Выставлен на трансфер':'Снят с продажи','info');}
};
A.plsell=function(el){
  var p=S.squad.find(function(x){return x.id===+el.dataset.id;});
  if(!p)return;
  var gks=S.squad.filter(function(x){return x.pos==='GK';}).length;
  if(S.squad.length<=14||(p.pos==='GK'&&gks<=1)){toast('Минимум 14 игроков и 1 вратарь','err');return;}
  var pr=Math.round(p.val*.75);
  S.money+=pr;
  S.squad=S.squad.filter(function(x){return x.id!==p.id;});
  S.stats.tout++;
  if(pr>=40e6)unlock('sell');
  news('coins',p.name+' продан за '+money(pr));
  sndCash();autoXI();save();closeModal();render();
  toast('Продан '+p.name,'money');
};
A.renew=function(el){
  var p=S.squad.find(function(x){return x.id===+el.dataset.id;});
  if(!p)return;
  var hap=happy(p).v;
  var ask=Math.round(p.wage*(1.15+(100-hap)/220)/100)*100;
  var h='<div class="mt">'+I('doc',17)+' Продление: '+esc(p.name)+'</div>';
  h+='<div class="dim" style="font-size:12px;margin-bottom:9px">Текущая ЗП '+money(p.wage)+' · осталось '+p.cy+' лет · довольство '+hap+'%<br>Агент запрашивает <b class="money">'+money(ask)+'</b>/нед.</div>';
  h+='<div class="fl"><span class="dim">Новый срок</span><b>3 года</b></div>';
  h+='<div class="fl"><span class="dim">Зарплата</span><b class="money">'+money(ask)+'/нед</b></div>';
  h+=btn('renewyes','Предложить контракт','btn-p btn-block',' data-id="'+p.id+'" data-w="'+ask+'" style="margin-top:10px"');
  h+=btn('close','Отмена','btn-g btn-block',' style="margin-top:6px"');
  modal(h);
};
A.renewyes=function(el){
  var p=S.squad.find(function(x){return x.id===+el.dataset.id;});
  if(!p)return;
  var w=+el.dataset.w;
  var hap=happy(p).v;
  var pr=clamp(.2+hap/150+(w/p.wage-1)*.7+(has(p,'loyal')?.2:0)+(prestige(club())-60)/120,.05,.96);
  if(chance(pr)){
    p.wage=w;p.cy=3;
    p.mor=clamp(p.mor+10,0,100);
    value(p);
    news('doc',p.name+' продлил контракт на 3 года');
    sndCash();save();closeModal();render();
    toast('Контракт продлён','ok');
  }else{
    p.mor=clamp(p.mor-4,10,100);
    save();closeModal();render();
    toast('Агент отклонил предложение','err');
  }
};
A.loanout=function(el){
  var p=S.squad.find(function(x){return x.id===+el.dataset.id;});
  if(!p)return;
  if(S.squad.filter(free).length<12){toast('Слишком мало игроков','err');return;}
  var c=pick(S.clubs.filter(function(x){return x.id!==S.club;}));
  p.loan=18;p.start=false;
  S.money+=p.wage*20;
  news('plane',p.name+' отдан в аренду в «'+c.name+'» на 18 недель');
  autoXI();save();closeModal();render();
  toast('Отдан в аренду','ok');
};
A.buy=function(el){
  var p=S.market.find(function(x){return x.id===+el.dataset.id;});
  if(!p)return;
  var price=Math.round(p.val*(1-skill('neg')*.05));
  if(S.money<price){toast('Недостаточно бюджета','err');return;}
  if(S.squad.length>=24){toast('Состав заполнен','err');return;}
  S.money-=price;
  S.market=S.market.filter(function(x){return x.id!==p.id;});
  p.org=club().name;p.cy=ri(3,4);
  S.squad.push(p);
  S.stats.tin++;
  news('dl','Подписан '+p.name+' за '+money(price));
  sndCash();autoXI();save();closeModal();render();
  toast('Подписан '+p.name,'money');
};
A.mkpos=function(el){U.mk.pos=el.dataset.v;render();};
A.scout=function(){
  if(S.money<60000){toast('Недостаточно средств','err');return;}
  S.money-=60000;
  S.market=mkMarket(26);
  save();render();toast('Рынок обновлён','info');
};
A.upstad=function(){
  var c=club(),nl=c.stLv+1;
  if(S.money<STC[nl]||S.build)return;
  S.money-=STC[nl];
  S.build={lv:nl,w:3};
  news('stadium','Начато расширение стадиона');
  save();render();toast('Стройка · 3 недели','ok');
};
A.upfac=function(el){
  var k=el.dataset.k,lv=S[k]+1;
  if(S.money<FAC[lv])return;
  S.money-=FAC[lv];
  S[k]=lv;
  news('up','Улучшено: '+k+' ур.'+lv);
  save();render();toast('Улучшено','ok');
};
A.ticket=function(el){S.ticket=+el.value;save();render();};
A.staffhire=function(el){
  var k=el.dataset.k;
  if(S.money<4e5){toast('Нужно €400К','err');return;}
  S.money-=4e5;
  var lv=ri(1,3);
  S.staff.push({k:k,lv:lv,wage:lv*28000});
  news('users','Специалист нанят (ур.'+lv+')');
  save();render();toast('Нанят','ok');
};
A.stafffire=function(el){
  S.staff=S.staff.filter(function(x){return x.k!==el.dataset.k;});
  save();render();toast('Уволен','info');
};
A.staffup=function(el){
  var s=null;
  S.staff.forEach(function(x){if(x.k===el.dataset.k)s=x;});
  if(!s||s.lv>=5)return;
  var c=s.lv*8e5;
  if(S.money<c)return;
  S.money-=c;s.lv++;s.wage=s.lv*28000;
  save();render();toast('Квалификация повышена','ok');
};
A.spreq=function(){
  if(S.spCd>0)return;
  S.spCd=3;
  inbox('sp',{vars:spOffers()},4);
  save();render();toast('4 предложения во Входящих','info');
};
A.spreload=function(el){
  var it=S.inbox.find(function(x){return x.id===+el.dataset.id;});
  if(!it)return;
  it.p.vars=spOffers();
  save();render();
};
A.sppick=function(el){
  var it=S.inbox.find(function(x){return x.id===+el.dataset.id;});
  if(!it)return;
  var v=it.p.vars[+el.dataset.v];
  if(!v)return;
  S.sponsor=v;S.money+=v.sign;S.spEarn+=v.sign;
  S.inbox=S.inbox.filter(function(x){return x.id!==it.id&&x.t!=='sp';});
  news('pct','Титульный спонсор — «'+v.brand+'». Аванс '+money(v.sign));
  sndCash();save();render();
  toast('Контракт подписан','money');
};
A.spbreak=function(){
  if(!S.sponsor)return;
  var pen=Math.round(S.sponsor.sign*.35);
  modal('<div class="mt">'+I('alert',17)+' Расторжение</div><p class="dim" style="font-size:13px;margin-bottom:12px">Штраф <b class="neg">'+money(pen)+'</b>.</p><div class="row" style="gap:7px">'+btn('close','Отмена','btn-g grow')+btn('spbreakyes','Расторгнуть','btn-d grow')+'</div>');
};
A.spbreakyes=function(){
  if(!S.sponsor)return;
  S.money-=Math.round(S.sponsor.sign*.35);
  S.sponsor=null;S.spCd=1;
  save();closeModal();render();toast('Контракт расторгнут','err');
};
A.saleyes=function(el){
  var it=S.inbox.find(function(x){return x.id===+el.dataset.id;});
  if(!it)return;
  var q=S.squad.find(function(x){return x.id===it.p.pid;});
  if(!q)return;
  if(S.squad.length<=14){toast('Минимум 14 игроков','err');return;}
  S.money+=it.p.amount;
  S.squad=S.squad.filter(function(x){return x.id!==q.id;});
  S.stats.tout++;
  if(it.p.amount>=40e6)unlock('sell');
  S.inbox=S.inbox.filter(function(x){return x.id!==it.id;});
  news('coins',q.name+' ушёл в '+it.p.buyer+' за '+money(it.p.amount));
  sndCash();autoXI();save();render();
  toast('Продан '+q.name,'money');
};
A.saleup=function(el){
  var it=S.inbox.find(function(x){return x.id===+el.dataset.id;});
  if(!it||it.p.counter)return;
  it.p.amount=Math.round(it.p.amount*1.18/10000)*10000;
  it.p.counter=true;
  save();render();toast('Покупатель согласился на +18%','money');
};
A.reqsell=function(el){
  var it=S.inbox.find(function(x){return x.id===+el.dataset.id;});
  if(!it)return;
  var q=S.squad.find(function(x){return x.id===it.p.pid;});
  if(!q)return;
  if(S.squad.length<=14){toast('Минимум 14 игроков','err');return;}
  var pr=Math.round(q.val*.85/10000)*10000;
  S.money+=pr;
  S.squad=S.squad.filter(function(x){return x.id!==q.id;});
  S.stats.tout++;
  S.inbox=S.inbox.filter(function(x){return x.id!==it.id;});
  sndCash();autoXI();save();render();
  toast('Продан '+q.name,'money');
};
A.reqpromise=function(el){
  var it=S.inbox.find(function(x){return x.id===+el.dataset.id;});
  if(!it)return;
  var q=S.squad.find(function(x){return x.id===it.p.pid;});
  if(q){q.mor=clamp(q.mor+15,0,100);q.start=true;q.role='main';}
  S.inbox=S.inbox.filter(function(x){return x.id!==it.id;});
  save();render();toast('Обещание дано','ok');
};
A.reqno=function(el){
  var it=S.inbox.find(function(x){return x.id===+el.dataset.id;});
  if(!it)return;
  var q=S.squad.find(function(x){return x.id===it.p.pid;});
  if(q)q.mor=clamp(q.mor-20,10,100);
  S.inbox=S.inbox.filter(function(x){return x.id!==it.id;});
  save();render();toast('Игрок расстроен','err');
};
A.jobyes=function(el){
  var it=S.inbox.find(function(x){return x.id===+el.dataset.id;});
  if(it)acceptJob(it);
};
A.natyes=function(el){
  var it=S.inbox.find(function(x){return x.id===+el.dataset.id;});
  if(!it)return;
  var n=it.p.n;
  S.nat={n:n,squad:natSquad(n),stats:{m:0,w:0,d:0,l:0,gf:0,ga:0}};
  S.nc=null;
  S.inbox=S.inbox.filter(function(x){return x.id!==it.id;});
  rep(3);
  news('globe','Вы возглавили сборную '+NATS[n][0]);
  sndCash();save();render();
  toast('Вы тренер сборной','ok');
};
A.natquit=function(){
  if(!S.nat)return;
  news('globe','Вы покинули сборную '+NATS[S.nat.n][0]);
  S.nat=null;S.nc=null;
  save();render();
};
A.presspick=function(el){
  var it=S.inbox.find(function(x){return x.id===+el.dataset.id;});
  if(!it)return;
  var o=it.p.o[+el.dataset.v];
  if(o.mor)S.squad.forEach(function(p){p.mor=clamp(p.mor+o.mor,10,100);});
  if(o.conf)S.board=clamp(S.board+o.conf,0,100);
  if(o.fans)S.fans=clamp(S.fans+o.fans,0,100);
  S.inbox=S.inbox.filter(function(x){return x.id!==it.id;});
  save();render();maybeSack();
};
A.sackpick=function(el){
  var t=byId(+el.dataset.id);
  if(!t)return;
  S.club=t.id;
  S.money=Math.round(t.budget*DIFFS[S.diff].m*.6);
  S.squad=mkSquad(t);
  autoXI();
  S.board=42;S.fans=45;S.sponsor=null;S.spEarn=0;S.trained=0;S.inbox=[];
  S.mh.push(S.money);
  S.interest=clamp(S.interest*.5,3,25);
  S.jobCd=16;S.offCd=8;S.weeks=0;S.pending=false;S.cup=null;
  U.lg=null;U.rd=null;
  inbox('sp',{vars:spOffers()},4);
  inbox('info',{title:'Антикризисный контракт',text:'Вы возглавили «'+t.name+'» после отставки. Доверие минимально.'},5);
  news('case','Вы возглавили «'+t.name+'» после увольнения');
  closeModal();save();render();
  toast('Новый клуб: «'+t.name+'»','info');
};
A.skillup=function(el){
  var k=el.dataset.k;
  if(S.pts<=0||skill(k)>=5)return;
  S.pts--;S.sk[k]++;
  save();render();toast('Навык улучшен','ok');
};
A.study=function(){
  if(S.money<4e5)return;
  S.money-=4e5;
  licXp(60);
  save();render();
};
A.lgview=function(el){U.lg=+el.dataset.v;render();};
A.rdprev=function(){U.rd=clamp((U.rd===null?0:U.rd)-1,0,ROUNDS-1);render();};
A.rdnext=function(){U.rd=clamp((U.rd===null?0:U.rd)+1,0,ROUNDS-1);render();};
A.mtac=function(el){S.tac[el.dataset.k]=+el.value;tacLive();save();};
A.mtog=function(el){S.tac[el.dataset.k]=!S.tac[el.dataset.k];tacLive();save();};
A.men=function(el){
  if(!M||M.state==='end')return;
  S.tac.men=el.dataset.v;
  tacLive();
  $$('#segMen button').forEach(function(b){b.classList.toggle('on',b.dataset.v===S.tac.men);});
  feed(M.min,'whistle','Менталитет: '+MENT[S.tac.men].n,'dec');
  hud();save();
};
A.speed=function(el){
  if(!M)return;
  M.speed=+el.dataset.v;
  S.set.speed=M.speed;save();
  $$('#segSp button').forEach(function(b){b.classList.toggle('on',+b.dataset.v===M.speed);});
  timer();
};
A.pause=function(){
  if(!M||M.state==='end'||M.state==='dec'||M.state==='subs')return;
  M.state=M.state==='pause'?'run':'pause';
  $('#btnPause').innerHTML=I(M.state==='pause'?'play':'pause',16);
  hud();
  toast(M.state==='pause'?'Пауза':'Продолжаем','info');
};
A.skip=function(){fastForward();};
A.subs=function(){
  if(!M||M.state==='end'||M.state==='dec')return;
  if(M.state==='subs')closeSubs();else openSubs();
};
A.subpick=function(el){
  if(!M||M.state==='end'||M.state==='dec')return;
  var id=el.dataset.id;
  openSubs(isNaN(+id)?id:+id);
};
A.oppinfo=function(el){
  if(!M)return;
  var op=null;
  M.op.players.forEach(function(x){if(String(x.id)===el.dataset.id)op=x;});
  if(op)toast(op.name+' · '+PM[op.pos].s+' · '+op.rt,'info');
};
A.subclose=function(){closeSubs();};
A.subout=function(el){
  if(!M)return;
  var id=el.dataset.id;
  M.subOut=isNaN(+id)?id:+id;
  subsRender();
};
A.subin=function(el){
  if(!M||M.subOut===null){toast('Сначала выберите, кого меняем','info');return;}
  var id=el.dataset.id;
  doSub(M.subOut,isNaN(+id)?id:+id);
};
A.decpick=function(el){decResolve(+el.dataset.i,false);};
A.decskip=function(){decResolve(1,true);};
A.mcont=function(){closeMatch();closeModal();render();maybeSack();};
A.mfinish=function(){closeMatch();closeModal();finishSeason();};

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');
  if(!el)return;
  if(el.tagName==='INPUT'||el.tagName==='SELECT')return;
  audioInit();
  if(AC&&AC.state==='suspended')AC.resume();
  var a=el.dataset.a;
  if(a!=='skip'&&a!=='begin')sndClick();
  if(A[a])A[a](el);
});
document.addEventListener('input',function(e){
  var t=e.target;
  var a=t.dataset?t.dataset.a:null;
  if(a&&A[a]&&t.tagName!=='SELECT'){A[a](t);return;}
  if(t.id==='stName')U.st.name=t.value;
  if(t.id==='stQ'){
    U.st.q=t.value;
    renderStart();
    var i=$('#stQ');
    if(i){i.focus();try{i.setSelectionRange(i.value.length,i.value.length);}catch(er){}}
  }
  if(t.id==='mkQ'){
    U.mk.q=t.value;
    var m=$('#mkList');
    if(m)m.innerHTML=marketList();
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  var a=t.dataset?t.dataset.a:null;
  if(a&&A[a]&&t.tagName==='SELECT'){A[a](t);return;}
  if(t.id==='mkSort'){
    U.mk.sort=t.value;
    var m=$('#mkList');
    if(m)m.innerHTML=marketList();
  }
  if(t.id==='setSpeed'){
    S.set.speed=+t.value;save();
    if(M){M.speed=S.set.speed;timer();}
  }
  if(t.id==='fileIn'){
    var f=t.files[0];
    if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var s=JSON.parse(r.result);
        if(s&&s.v===30&&s.clubs&&s.clubs.length===CLUBS.length){
          S=s;MUTE=!S.set.sound;
          save();closeModal();closeMatch();hideStart();
          U.tab='office';render();
          toast('Сейв импортирован','ok');
          maybeSack();
        }else toast('Неверный файл сейва','err');
      }catch(er){toast('Ошибка импорта','err');}
    };
    r.readAsText(f);
    t.value='';
  }
});
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  var k=e.key.toLowerCase();
  if(k==='escape'){closeModal();return;}
  if(k==='m'){setMute(!MUTE);return;}
  if(!M)return;
  if(k===' '){e.preventDefault();A.pause();return;}
  if(k==='s'){A.subs();return;}
  if(k==='f'){fastForward();return;}
  if(k==='1'||k==='2'||k==='3'){
    var mm=['attack','balance','defense'][+k-1];
    S.tac.men=mm;tacLive();
    $$('#segMen button').forEach(function(b){b.classList.toggle('on',b.dataset.v===mm);});
    hud();save();
  }
});

/* ---------- ЗАПУСК ---------- */
try{
  S=load();
  if(S){
    MUTE=!S.set.sound;
    hideStart();
    render();
    maybeSack();
  }else showStart();
}catch(err){
  console.error(err);
  window.__fail(err&&err.message?err.message:String(err));
}
})();
</script>
